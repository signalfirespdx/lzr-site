# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo:  signalfirespdx/lzr-src

media_folder: /public
public_folder: /
app_title: LZR Site Admin

media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: categories
    label: Categories
    folder: /content/categories
    create: true
    slug: "{{slug}}"
    fields:
      - label: Name
        name: name
        widget: string
        hint: "Machine-readable name (used as key, e.g. 'zines', 'events')"

      - label: Label
        name: label
        widget: string
        hint: "Human-readable label (e.g. 'Zines', 'Upcoming Events')"

      - label: Image
        name: image
        widget: image
        required: false
        hint: "Optional image used for category cards, headers, or filters"
  - name: posts
    label: Posts
    folder: /content/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Body, name: body, widget: markdown }

  - name: zines
    label: Zines
    folder: /content/zines
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Name, name: name, widget: string }
      - label: Category
        name: category
        widget: relation
        collection: categories
        search_fields: ["name", "label"]
        value_field: "name"
        display_fields: ["label"]
      - label: Tags
        name: tags
        widget: list
        summary: "{{fields.tag}}"
        required: false
        fields: [{ label: Tag, name: tag, widget: string }]
      - label: Folding style
        name: folding_style
        widget: select
        required: false
        options:
          - "1-sided 8pg mini"
          - "1-sided 8pg-alt mini"
          - "1-sided 1pg"
          - "1-sided quarter"
          - "trifold"
          - "2-sided trifold"
          - "2-sided trifold short-side"
          - "2-sided 16pg mini"
          - "2-sided half"
          - "2-sided 8pg"
          - "2-sided 8pg up"
      - { label: Preview image, name: preview_image, widget: image }
      - { label: File, name: file, widget: file }
      - { label: Description, name: description, widget: markdown, required: false}

  - name: events
    label: Events
    folder: /content/events
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Category, name: category, widget: string, required: false }
      - label: Tags
        name: tags
        widget: list
        required: false
        summary: "{{fields.tag}}"
        field: { label: Tag, name: tag, widget: string }
      - { label: Start, name: start, widget: datetime, format: "YYYY-MM-DDTHH:mm:ss.SSSZ"  }
      - { label: End, name: end, widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ss.SSSZ"}
      - label: Repeats
        name: repeats
        widget: select
        default: none
        options:
          - { label: Does not repeat, value: none }
          - { label: Daily, value: daily }
          - { label: Weekly (on start day), value: weekly }
          - { label: Monthly (nth weekday), value: monthly_nth_weekday }
          - { label: Monthly (last weekday), value: monthly_last_weekday }
          - { label: Annually, value: yearly }
          - { label: Every weekday (Mon–Fri), value: weekdays }
          - { label: Custom…, value: custom }
      - { label: RRULE (custom), name: rrule, widget: string, required: false, hint: "Leave blank unless using Custom. Example: FREQ=MONTHLY;BYDAY=SU;BYSETPOS=-1" }
      - label: Repeat until
        name: repeat_until
        widget: datetime
        required: false
        format: "YYYY-MM-DDTHH:mm:ss.SSSZ"
        hint: "Optional. If set, the last occurrence will be on/before this date/time."
      - { label: Location, name: location, widget: string, required: false }
      - { label: Address, name: address, widget: string, required: false }
      - { label: Link, name: link, widget: string, required: false }
      - { label: Image, name: image, widget: image, required: false }
      - { label: Description, name: description, widget: markdown, required: false }
      - { label: Featured, name: featured, widget: boolean, required: false, default: false }

      
  - name: sites
    label: Sites
    folder: /content/sites
    create: true
    sortable_fields: ["order", "name"]
    fields:
      - { label: Name, name: name, widget: string }
      - { label: Url, name: url, widget: string}
      - { label: Order, name: order, widget: number }
      
  - name: email-templates
    label: Email Templates
    folder: /content/email-templates
    create: true
    fields:
      - { label: Name, name: name, widget: string, readonly: false }
      - { label: Subject, name: subject, widget: string }
      - { label: Body, name: email_body, widget: text }
      
  - name: gallery-images
    label: Gallery
    folder: /content/gallery-images
    summary: "{{fields.alt}}"
    create: true
    fields:
      - { label: Image, name: image, widget: image }
      - { label: Alt Text, name: alt, widget: text }
      - { label: Added, name: added_on, widget: datetime }
